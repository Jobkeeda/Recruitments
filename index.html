<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobKeeda – Find your next job</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #2f3e4e;
    --board-dark: #263341;
    --ink: #2b2b2b;
    --paper: #f4f6f8;
    --pin: #d93f3f;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--paper);
    background-color: var(--board);
    background-image:
      radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 22px 22px;
    min-height: 100vh;
  }
  header {
    max-width: 1100px; margin: 0 auto; padding: 28px 24px 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand {
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 2.2rem;
    color: #ffd95a; text-decoration: none; letter-spacing: .5px;
  }
  .brand span { color: var(--paper); }
  header nav a {
    color: var(--paper); text-decoration: none; font-weight: 600; margin-left: 20px; opacity: .8;
  }
  header nav a:hover { opacity: 1; }
  .hero { max-width: 1100px; margin: 0 auto; padding: 56px 24px 24px; }
  .hero h1 {
    font-family: 'Caveat', cursive; font-weight: 700;
    font-size: clamp(2.6rem, 6vw, 4.4rem); line-height: 1.05; max-width: 14em;
  }
  .hero p { margin-top: 14px; font-size: 1.1rem; opacity: .8; max-width: 32em; }

  .board {
    max-width: 1100px; margin: 0 auto; padding: 36px 24px 80px;
    display: grid; gap: 34px 28px;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  }
  .note {
    --c: #ffe97a;
    position: relative; display: flex; flex-direction: column; justify-content: space-between;
    min-height: 190px; padding: 40px 20px 18px;
    background: linear-gradient(170deg, var(--c) 0%, var(--c) 70%, color-mix(in srgb, var(--c) 85%, #000) 100%);
    color: var(--ink); text-decoration: none;
    transform: rotate(var(--r, 0deg));
    box-shadow: 0 10px 14px -6px rgba(0,0,0,.45), 0 2px 0 rgba(0,0,0,.08);
    border-radius: 2px 2px 14px 2px;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .note::before { /* pin */
    content: ""; position: absolute; top: 12px; left: 50%; width: 16px; height: 16px; margin-left: -8px;
    border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8a8a, var(--pin) 60%);
    box-shadow: 0 3px 4px rgba(0,0,0,.4);
  }
  .note:hover, .note:focus-visible {
    transform: rotate(0deg) translateY(-6px) scale(1.04);
    box-shadow: 0 18px 22px -8px rgba(0,0,0,.55);
    outline: none; z-index: 2;
  }
  .note:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .note .icon { font-size: 2rem; line-height: 1; }
  .note h2 {
    font-family: 'Caveat', cursive; font-weight: 700; font-size: 1.9rem; line-height: 1.05; margin-top: 10px;
  }
  .note .go { font-size: .85rem; font-weight: 800; opacity: .65; margin-top: 12px; }

  .note:nth-child(5n+1) { --c: #ffe97a; --r: -2deg; }
  .note:nth-child(5n+2) { --c: #ff9fb8; --r: 1.5deg; }
  .note:nth-child(5n+3) { --c: #9fe3c2; --r: -1deg; }
  .note:nth-child(5n+4) { --c: #ffb872; --r: 2.2deg; }
  .note:nth-child(5n+5) { --c: #a5d1ff; --r: -1.8deg; }

  footer { text-align: center; padding: 0 24px 40px; opacity: .6; font-size: .9rem; }
  @media (prefers-reduced-motion: reduce) { .note { transition: none; } }
</style>
</head>
<body>

<header>
  <a class="brand" href="index.html">Job<span>Keeda</span></a>
  <nav>
    <a href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=mPJyn3wyRku5XfbUzfnect0SPkIxx_JJsaXeJFRSNxRUM01aNE02SFU2WktVSUVMWU84V00wN0xJWS4u">Add jobs</a>
  </nav>
</header>

<section class="hero">
  <h1>Pick a note. Find your next job.</h1>
  <p>Choose the field you work in and see the openings pinned there.</p>
</section>

<main class="board" id="board" aria-label="Job categories"></main>

<footer>© <span id="year"></span> JobKeeda</footer>

<script>
  // Add or remove categories here – the page and links update automatically.
  const categories = [
    { name: "IT & Software",            icon: "💻" },
    { name: "Engineering",              icon: "⚙️" },
    { name: "Manufacturing",            icon: "🏭" },
    { name: "Healthcare",               icon: "🩺" },
    { name: "Finance & Accounts",       icon: "💰" },
    { name: "Sales & Marketing",        icon: "📣" },
    { name: "Human Resources",          icon: "🤝" },
    { name: "Administration",           icon: "🗂️" },
    { name: "Operations",               icon: "📋" },
    { name: "Supply Chain & Logistics", icon: "🚚" },
    { name: "Customer Support",         icon: "🎧" },
    { name: "Education",                icon: "🎓" },
    { name: "Hospitality",              icon: "🛎️" },
    { name: "Construction",             icon: "🏗️" },
    { name: "Legal",                    icon: "⚖️" },
    { name: "Other",                    icon: "✨" }
  ];

  const board = document.getElementById('board');

  categories.forEach(cat => {
    const a = document.createElement('a');
    a.className = 'note';
    // Result e.g. Jobs?category=Human%20Resources  (encoded so "&" is safe)
    a.href = 'Jobs?category=' + encodeURIComponent(cat.name);
    a.innerHTML =
      '<div><div class="icon" aria-hidden="true">' + cat.icon + '</div>' +
      '<h2></h2></div><div class="go">View jobs</div>';
    a.querySelector('h2').textContent = cat.name;
    board.appendChild(a);
  });

  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
